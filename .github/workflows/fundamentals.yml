name: fundamentals
on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * 0-4"
permissions:
  contents: write
concurrency:
  group: fundamentals
  cancel-in-progress: false
jobs:
  fundamentals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull scanner fundamentals
        run: python3 scripts/fundamentals.py 100 fundamentals.json scripts/symbols.txt
      - name: Commit if changed
        run: |
          git config user.name "fundamentals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fundamentals.json
          git diff --cached --quiet && echo unchanged && exit 0
          git commit -m "fundamentals: daily scanner refresh"
          git pull --rebase --autostash origin main && git push
