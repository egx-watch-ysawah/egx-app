name: datacedar-check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/datacedar-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: One call
        env:
          DC_KEY: ${{ secrets.DATACEDAR_API_KEY }}
        run: |
          curl -s -o /tmp/e 'https://api.datacedar.com/v3/exchanges' -H "X-API-Key: $DC_KEY"; jq -c '[.data[]? | select((.id // .code // .name // "" | tostring | ascii_downcase) | test("egx|egypt"))]' /tmp/e | head -c 600; echo
          sleep 2; curl -s -o /tmp/a 'https://api.datacedar.com/v3/stocks/assets?exchange=egx&q=GTWL&limit=5' -H "X-API-Key: $DC_KEY"; head -c 600 /tmp/a; echo
          SID=$(jq -r '.data[0].sid // .data[0].id // empty' /tmp/a); echo "sid=$SID"
          sleep 2; if [ -n "$SID" ]; then curl -s -D /tmp/h2 -o /tmp/b "https://api.datacedar.com/v3/stocks/$SID/bars?timeframe=1d&order=desc&limit=3" -H "X-API-Key: $DC_KEY"; head -1 /tmp/h2; grep -i '^x-ratelimit' /tmp/h2 || true; head -c 900 /tmp/b; echo; fi
