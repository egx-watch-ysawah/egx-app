# Institutional-accumulation flow jobs, after the EGX close (13:30 UTC = 15:30 Cairo winter).
# Chain: cache Starta history -> flow_signal.py (offline from the cache) -> freshness gate
# (session must equal the last expected trading day) -> build_flow_stats.py with that session.
# flow_signal.json / flow_stats.json are committed only if ALL steps succeed; any failure keeps
# the old files live and opens an issue.
name: flow-signal
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 0-4"
    - cron: "0 15 * * 0-4"  # retry 17:00 Cairo for late bars
permissions: { contents: write, issues: write }
concurrency:
  group: flow-signal
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.3.3 numpy==2.2.6
      - name: Cache Starta history
        run: python3 scripts/fetch_flow_hist.py flow_hist
      - name: Flow signal
        run: FLOW_HIST_DIR=flow_hist python3 scripts/flow_signal.py flow_signal.json
      - name: Freshness gate (session == last expected trading day)
        run: python3 scripts/check_flow_session.py flow_signal.json egx_holidays.json
      - name: Flow stats backtest
        run: python3 scripts/build_flow_stats.py flow_hist flow_stats.json "$(python3 -c "import json; print(json.load(open('flow_signal.json'))['session'])")"
      - name: Commit if changed
        run: |
          git config user.name "egx-bot"
          git config user.email "egx-bot@users.noreply.github.com"
          git add flow_signal.json flow_stats.json
          git diff --cached --quiet || (git commit -m "flow signal refresh" && git push)
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "flow-signal job failed" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

# End of workflow
